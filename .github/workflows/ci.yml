name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Stylelint
        run: pnpm stylelint

      - name: Check samples
        run: pnpm check:samples

      - name: Format check
        run: pnpm format:check

      - name: Cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: pnpm --filter chord-render exec playwright install --with-deps chromium webkit

      - name: Bidi geometry (chromium + webkit)
        if: runner.os == 'Linux'
        run: pnpm --filter chord-render test:bidi

      - name: Upload bidi report
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bidi-report
          path: packages/chord-render/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tauri debug build
        run: pnpm tauri build --debug

      - name: Launch smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/smoke/smoke-launch.sh apps/desktop/src-tauri/target/debug/shir

      - name: Install E2E dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y webkit2gtk-driver

      - name: Cache tauri-driver (Linux)
        if: runner.os == 'Linux'
        id: tauri-driver-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver (Linux)
        if: runner.os == 'Linux' && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Real-app E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e

      - name: Upload E2E logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: e2e/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Launch smoke (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File scripts/smoke/smoke-launch.ps1 -Binary apps/desktop/src-tauri/target/debug/shir.exe

      - name: Upload debug bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/debug/bundle/**
          if-no-files-found: error
          retention-days: 7

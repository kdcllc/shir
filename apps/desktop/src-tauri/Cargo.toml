[package]
name = "shir"
version = "0.1.0"
description = "Shir - Hebrew and English chord sheets"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "shir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

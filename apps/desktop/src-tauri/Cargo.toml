[package]
name = "shir"
version = "0.1.0"
description = "Shir - Hebrew and English chord sheets"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "shir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
rusqlite_migration = "=2.7.0"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "=0.0.15"
uuid = { version = "=1.29.2", features = ["v7"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
unicode-normalization = "=0.1.26"
thiserror = "=2.0.21"
tauri-plugin-dialog = "=2.8.4"

[dev-dependencies]
tempfile = "=3.27.0"
